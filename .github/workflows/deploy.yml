# The only path to production: every push to main applies pending database
# migrations, then builds and deploys the site and functions to Netlify.
#
# Migrations run first so new code never meets an old schema. If the Netlify
# step then fails, production has the new schema with the previous code, which
# is why migrations must stay backward compatible (additive first; drop or
# rename only after the code that stops using it is live).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, in push order; never cancel one mid-way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# write: the last step pushes the vYYYY.MM.DD.N tag and creates the GitHub Release.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version step counts today's existing v* tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:functions

      # Calendar version YYYY.MM.DD.N: today's UTC date plus the number of this
      # deploy today (existing tags + 1). No human picks it; the concurrency
      # group above serializes deploys, so N cannot collide. It is stamped into
      # package.json in this working tree only (nothing is committed back to
      # main), and vite.config.ts bakes it into the build for the profile
      # footer. Written with node, not `npm version`: 2026.09.29.1 is not
      # valid semver. Stamped after `npm ci`/lint, just before the build.
      - name: Compute version
        run: |
          today=$(date -u +%Y.%m.%d)
          n=$(git tag --list "v$today.*" | wc -l)
          version="$today.$((n + 1))"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: v$version"
          VERSION="$version" node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # Same access-token-only authentication as ci.yml.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wojqiexptcgcvqeapgji
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes

      # Builds with the environment variables stored in Netlify (production
      # context) and uploads the site plus netlify/functions. The build command
      # comes from netlify.toml. --context matters: the CLI defaults to "dev".
      - name: Build and deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >-
          npx --yes netlify-cli@27.10.0 deploy
          --prod
          --context production
          --message "v$APP_VERSION ${{ github.sha }}: $(git log -1 --format=%s | head -c 150)"

      # After the deploy, so a failed deploy never consumes a version.
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$APP_VERSION"
          git push origin "v$APP_VERSION"
          gh release create "v$APP_VERSION" --title "v$APP_VERSION" --generate-notes --target "$GITHUB_SHA"
